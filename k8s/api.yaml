apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: habittracker
data:
  NODE_ENV: production
  PORT: '4000'
  APP_URL: https://habittracker.example.com
  API_URL: https://api.habittracker.example.com
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/habittracker
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 30d
  RATE_LIMIT_MAX: '120'
  RATE_LIMIT_WINDOW: 1 minute
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: habittracker
type: Opaque
stringData:
  JWT_ACCESS_SECRET: replace-with-access-secret
  JWT_REFRESH_SECRET: replace-with-refresh-secret
  SMTP_HOST: mailhog
  SMTP_PORT: '1025'
  SMTP_FROM: Habit Tracker <noreply@habittracker.local>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: habittracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/habittracker-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: habittracker
spec:
  selector:
    app: api
  ports:
    - port: 4000
      targetPort: 4000
