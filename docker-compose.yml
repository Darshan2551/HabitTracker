version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: habittracker-postgres
    environment:
      POSTGRES_DB: habittracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d habittracker']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: habittracker-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: habittracker-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: habittracker-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_URL: http://localhost:5173
      API_URL: http://localhost:4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/habittracker
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change-this-access-secret-32-characters-minimum
      JWT_REFRESH_SECRET: change-this-refresh-secret-32-characters-minimum
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: Habit Tracker <noreply@habittracker.local>
      RATE_LIMIT_MAX: 120
      RATE_LIMIT_WINDOW: 1 minute
    command: >
      sh -c "npm --workspace apps/api run prisma:migrate &&
             node apps/api/dist/main.js"
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: habittracker-web
    depends_on:
      - api
    ports:
      - '5173:80'

volumes:
  postgres_data:
  redis_data:
