name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: habittracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d habittracker"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/habittracker
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:5173
      API_URL: http://localhost:4000
      JWT_ACCESS_SECRET: ci-access-secret-that-is-over-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-over-32-characters
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_FROM: Habit Tracker <ci@habittracker.local>
      RATE_LIMIT_MAX: 1000
      RATE_LIMIT_WINDOW: 1 minute
      RUN_INTEGRATION_TESTS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm --workspace apps/api run prisma:generate

      - name: Apply DB migrations
        run: npm --workspace apps/api run prisma:migrate

      - name: Run API tests
        run: npm run test:api

      - name: Run Web tests
        run: npm run test:web

      - name: Run lint
        run: npm run lint

      - name: Build API
        run: npm run build:api

      - name: Build Web
        run: npm run build:web

      - name: Upload API coverage
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: ignore
